name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  ci:
    name: Install · Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
          CRON_SECRET: test-cron-secret
          GEMINI_API_KEY: test-gemini-key
          MERCADOPAGO_ACCESS_TOKEN: TEST-fake-access-token
          MERCADOPAGO_WEBHOOK_SECRET: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          NEXT_PUBLIC_MP_PUBLIC_KEY: TEST-fake-public-key
          MP_PLAN_ID: fake-plan-id

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          CRON_SECRET: placeholder-cron-secret
          GEMINI_API_KEY: placeholder-gemini-key
          MERCADOPAGO_ACCESS_TOKEN: TEST-placeholder-access-token
          MERCADOPAGO_WEBHOOK_SECRET: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          NEXT_PUBLIC_MP_PUBLIC_KEY: TEST-placeholder-public-key
          MP_PLAN_ID: placeholder-plan-id
